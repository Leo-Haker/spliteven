spring.application.name=spliteven

# Databasanslutning
spring.datasource.url=jdbc:postgresql://localhost:5432/spliteven
spring.datasource.username=minanvandare
spring.datasource.password=balans123

# JPA/Hibernate-inställningar
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit driver och dialekt - undviker Hibernate-fel vid JDBC-metadata-avläsning
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com